# =============================================================================
# TEMPLATE ONLY — environment secrets must NOT be written here as plain values.
#
# SIT auto-deploy rsyncs this file to PortalServer on every --engine push.
# Put real JWT_SECRET / DB / Redis / API keys in:
#   /home/yuan.z/rois/sit/env/engine-server.env   (never overwritten by deploy)
# and reference them with ${ENV_VAR} below.
# Ops contract: deploy/sit/CONFIG.md
# Optional host-only overlay (rsync-excluded): config.local.yaml
# =============================================================================
server:
  host: "0.0.0.0"
  port: 3103
  debug: true
  # API 文档端点（Swagger / ReDoc / OpenAPI schema）：null = 禁用，避免未鉴权泄露接口结构。
  # 仅本地开发需要调试文档时改为 "/docs" "/redoc" "/openapi.json"。
  docs_url: null
  redoc_url: null
  openapi_url: null
  cors:
    # 空列表 = 禁止跨域浏览器访问。engine-server 合法浏览器调用全部同源（nginx 反代 /<prefix>/engine），
    # 服务间调用不走 CORS —— 严禁 "*"。
    allow_origins: []
    allow_methods:
      - "GET"
      - "POST"
    allow_headers:
      - "X-Airline"
      - "X-API-Key"
      - "Authorization"
      - "Content-Type"

auth:
  enabled: true  # 启用认证

  # JWT 认证 (推荐 — 复用 Live Server 签发的 JWT)
  jwt:
    enabled: true
    # Must match live-server JWT_SECRET (SIT: sit/env/engine-server.env + live-server.env)
    secret: "${JWT_SECRET}"
    algorithm: "HS256"
    verify_exp: true  # 是否校验过期时间

  # API Key 认证 (面向 Live Server 等服务间调用)
  api_key:
    enabled: true
    key: "${ROIS_API_KEY:your_api_key_here}"

  # 静态 Bearer Token 认证 (向后兼容)
  bearer_token:
    enabled: false
    token: "${ROIS_BEARER_TOKEN:your_bearer_token_here}"

  # 航司特定认证 (可选)
  airline_auth:
    BR:
      api_key: ""
      bearer_token: ""
    F8:
      api_key: ""
      bearer_token: ""

  # 请求限流 (按 airline 维度)
  rate_limit:
    enabled: true
    rate: "15/minute"  # 每航司每分钟最多 15 个请求

paths:
  working_dir: "./workspace"
  finished_dir: "./finished"
  archive_dir: "./archive"
  temp_dir: "./temp"
  complete_dir: "./complete"

file_management:
  archive_days: 1
  cleanup_days: 30
  complete_compress_days: 1
  complete_cleanup_days: 5

tasks:
  max_concurrent: 10
  optimizer_max_concurrent:
    LegacyRO: 1
  timeout: 3600

# HTTP客户端配置
http_client:
  # Live Server请求超时时间（秒）
  # 注：input.gz生成可能需要1-3分钟，当请求localhost时可能需要更长时间
  # 建议设置20分钟（1200秒）以确保有足够时间处理
  timeout: 1200

redis:
  enabled: true
  host: "localhost"
  port: 6379
  password: null
  db: 0
  task_ttl: 3600

airlines:
  BR:
    optimizers:
