<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crew App · Duty Swap Ticket · Ver2</title>
<style>
:root{color-scheme:light;--bg:#edf0f6;--panel:#fff;--ink:#202335;--muted:#586174;--line:#ccd2df;--accent:#3d2b8c;--selected:#eee9fa;--white:#fff;--radius:16px;--small:8px;--space:12px;--font:15px;--title:20px}*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--ink);font:var(--font)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{color-scheme:dark;--bg:#202a32;--panel:#303c47;--ink:#f6f7fb;--muted:#d1d8e3;--line:#73808f;--accent:#c8b6fa;--selected:#473c63;--white:#231b35}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:var(--small);padding:12px;background:var(--panel);color:var(--ink);font-weight:600}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:var(--white);border-color:var(--accent)}.lab{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.lab small{flex:1;color:var(--muted)}.lab a{color:var(--accent)}.app{flex:1;width:100%;min-height:0;max-width:1280px;margin:auto;display:flex;flex-direction:column;padding:12px;gap:12px}.modes{display:flex;align-items:center;justify-content:center;gap:8px}.modes span{padding:8px 12px;font-weight:600}.modes .active{background:var(--selected);border-radius:var(--small);color:var(--accent)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);padding:4px;border:1px solid var(--line);border-radius:var(--radius)}.step{text-align:center;padding:8px;border-radius:12px;color:var(--muted)}.step strong{display:block;color:var(--ink)}.step.current{background:var(--accent);color:var(--white)}.step.current strong{color:inherit}.content{flex:1;overflow:auto;min-height:0;padding:4px}.intro{margin-bottom:16px}h1,h2,p{margin:0}h1{font-size:var(--title)}h2{font-size:16px}p,.muted{color:var(--muted)}.cards{display:grid;gap:12px}.duty,.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel);text-align:left}.duty{display:flex;align-items:center;gap:12px;width:100%}.duty>span{flex:1}.duty strong,.duty small{display:block}.duty small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}.duty[aria-checked=true],.duty[aria-pressed=true]{border:2px solid var(--accent);background:var(--selected);padding:15px}.card h2{margin-bottom:12px;color:var(--accent)}.entry+.entry{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.entry strong{display:block}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--small);background:var(--panel);color:var(--ink)}textarea{min-height:90px;margin-top:16px}.footer{display:flex;gap:12px}.footer .primary{flex:1}.count{display:block;font-weight:600;margin:12px 0}.kpis{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.kpis b{display:block;color:var(--accent)}dialog{max-width:400px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:24px}dialog::backdrop{background:#0007}dialog button{margin-top:16px} @media(max-width:559px){.split{grid-template-columns:1fr}.modes{gap:0}.modes span{padding:8px}.fields{grid-template-columns:1fr 1fr}}@media(max-height:550px){.lab{display:none}.app{min-height:0}.steps .step{padding:4px}.step strong{display:inline;margin-right:6px}.modes{display:none}}
</style></head><body>
<header class="lab"><strong>Ticket · Ver2</strong><small>Interactive mockup · sample duties · no requests are sent. <a href="duty-swap-mockups-Ver1.html">Original concepts</a></small><button id="theme">Dark appearance</button></header>
<main class="app"><nav class="modes" aria-label="Duty Swap modes"><span>Matrix</span><span>Market</span><span class="active">Ticket</span><span>Twin Rail</span></nav><nav class="steps" aria-label="Ticket progress"></nav><section id="content" class="content"></section><footer class="footer"><button id="back">← Back</button><button id="next" class="primary"></button></footer></main>
<dialog id="result"><h2>Mockup complete</h2><p>The app checks legality before sending the request to the selected crew. This preview does not contact the crew portal.</p><button onclick="document.querySelector('#result').close()">Back to ticket</button></dialog>
<script>
const names=['Give','Want','Pick','Send'];
const duties=[{id:'585',code:'PR585/PR586',date:'22 Oct',time:'09:55–18:25',route:'MNL → CEB → MNL'},{id:'181',code:'PR181/PR182',date:'26 Oct',time:'07:10–15:30',route:'MNL → TPE → MNL'},{id:'453',code:'PR453/PR454',date:'28 Oct',time:'08:20–17:15',route:'MNL → GES → MNL',locked:true}];
const offers=[{id:'481903',duties:[{code:'PR223/PR224',date:'22 Oct',time:'22:25 → 24 Oct 16:20',route:'MNL → BNE → MNL'},{code:'PR1861/PR1862',date:'26 Oct',time:'09:10–14:25',route:'MNL → CEB → MNL'}]},{id:'345945',duties:[{code:'PR213/PR214',date:'22 Oct',time:'11:20 → 24 Oct 09:00',route:'MNL → SYD → MNL'},{code:'PR1845/PR1846',date:'26 Oct',time:'07:10–12:35',route:'MNL → CEB → MNL'}]}];
let step=0, selected=new Set(), chosen=null, note='',filter='',type='Any duty',start='2026-10-22',end='2026-10-27';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entry=d=>`<div class="entry"><strong>${d.code}</strong><p>${d.date} · ${d.time}</p><small class="muted">${d.route}</small></div>`;
const give=()=>`<article class="card" id="selected-give"><h2>You give · ${selected.size} selected</h2>${duties.filter(d=>selected.has(d.id)).map(entry).join('')}</article>`;
const take=o=>o.duties.filter((d,i)=>i===0||selected.size>1);
const matches=()=>offers.filter(o=>o.id.includes(filter.trim())&&type!=='Standby');
function render(){
 document.querySelector('.steps').innerHTML=names.map((n,i)=>`<div class="step ${i===step?'current':''}" ${i===step?'aria-current="step"':''}><strong>${i+1}</strong>${n}</div>`).join('');
 const content=document.querySelector('#content');
 if(step===0) content.innerHTML=`<div class="intro"><h1>What will you give?</h1><p>Select one or more unlocked duties, then choose what you want.</p><span class="count">${selected.size} selected</span></div><div class="cards">${duties.map(d=>`<button class="duty" role="checkbox" aria-checked="${selected.has(d.id)}" data-give="${d.id}" ${d.locked?'disabled':''}><span><strong>${d.code}</strong><small>${d.date} · ${d.time}</small><small>${d.route}</small></span>${d.locked?'Crew control locked':selected.has(d.id)?'Selected':'Select'}</button>`).join('')}</div>`;
 if(step===1) content.innerHTML=`<div class="intro"><h1>What would you like?</h1><p>Keep your selected duties while filtering the target crew and duties.</p></div><div class="split">${give()}<article class="card"><h2>Find a target</h2><div class="fields"><label>Start date<input type="date" id="start" value="${start}"></label><label>End date<input type="date" id="end" value="${end}"></label><label>Crew ID<input id="crew" value="${esc(filter)}" placeholder="Any crew"></label><label>Duty type<select id="type"><option>Any duty</option><option>Flight</option><option>Standby</option></select></label></div><p style="margin-top:16px">Sample matches: 481903 and 345945. The app provides the full portal filter set.</p></article></div>`;
 if(step===2) content.innerHTML=`<div class="split">${give()}<div><div class="intro"><h1>You take</h1><p>Choose a crew to review · ${matches().length} matches</p></div><div class="cards">${matches().map(o=>`<button class="duty" data-match="${o.id}" aria-pressed="${chosen===o.id}"><span><strong>From ${o.id}${chosen===o.id?' · Selected':''}</strong>${take(o).map(entry).join('')}</span></button>`).join('')||'<div class="card">No matching published duties. Go back to change your filters.</div>'}</div></div></div>`;
 if(step===3){const o=offers.find(x=>x.id===chosen);content.innerHTML=`<div class="intro"><h1>Review your swap</h1><p>433535 ⇄ ${o.id}</p></div><div class="split" id="review">${give()}<article class="card"><h2>You take from ${o.id}</h2>${take(o).map(entry).join('')}</article></div><p style="margin-top:16px">Credit comparison and legality come from the crew portal in the app.</p><textarea id="note" aria-label="Optional note" placeholder="Note for ${o.id} (optional)">${esc(note)}</textarea>`;}
 document.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.give)?selected.delete(b.dataset.give):selected.add(b.dataset.give);chosen=null;render()});
 document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{if(chosen!==b.dataset.match)note='';chosen=b.dataset.match;render()});
 if(step===1){document.querySelector('#type').value=type;for(const id of ['crew','type','start','end']) document.getElementById(id).oninput=()=>{filter=document.querySelector('#crew').value;type=document.querySelector('#type').value;start=document.querySelector('#start').value;end=document.querySelector('#end').value;chosen=null;document.querySelector('#next').disabled=!start||!end||start>end;};}
 if(step===3)document.querySelector('#note').oninput=e=>note=e.target.value;
 const next=document.querySelector('#next'); next.textContent=step===3?'Check legality & send':step===1?'Find matches →':`Next: ${names[step+1]} →`;next.disabled=step===0?!selected.size:step===2?!chosen:step===1?(!start||!end||start>end):false;
 content.scrollTop=0;
}
document.querySelector('#next').onclick=()=>{if(step===3){document.querySelector('#result').showModal();return;}step++;render()};
document.querySelector('#back').onclick=()=>{if(step>0){step--;render()}else if(confirm('Leave this preview and return to the original concepts?'))location.href='duty-swap-mockups-Ver1.html'};
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'Light appearance':'Dark appearance'};
render();
</script></body></html>
