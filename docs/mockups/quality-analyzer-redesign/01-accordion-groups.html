<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 — Accordion Groups</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#2563eb;--primary-fg:#fff;--border:#e2e8f0;--muted:#64748b;--amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fcd34d;--green:#16a34a;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,Consolas,monospace}
    body{font-family:var(--font);font-size:12px;background:#94a3b8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45)}
    .dialog{position:relative;width:min(1100px,96vw);max-height:90vh;background:#fff;border-radius:8px;box-shadow:0 24px 48px rgba(15,23,42,.2);display:flex;flex-direction:column;overflow:hidden}
    .titlebar{background:var(--primary);color:var(--primary-fg);padding:10px 16px;display:flex;align-items:center;gap:8px;cursor:move}
    .titlebar .icon{width:28px;height:28px;border-radius:4px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:14px}
    .titlebar h1{font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
    .titlebar .badge{background:#f59e0b;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
    .titlebar .close{background:none;border:none;color:#fff;opacity:.8;font-size:18px;cursor:pointer}
    .toolbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .toolbar label{margin-left:auto;display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;color:#0f172a}
    .body{flex:1;overflow-y:auto;padding:12px 16px 16px}
    .accordion{display:flex;flex-direction:column;gap:8px}
    .acc-item{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
    .acc-item.has-issue{border-color:#fde68a}
    .acc-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:#f8fafc;user-select:none}
    .acc-item.open .acc-head{background:#fff;border-bottom:1px solid var(--border)}
    .acc-head:hover{background:#f1f5f9}
    .chev{width:16px;color:var(--muted);transition:transform .15s;font-size:10px}
    .acc-item.open .chev{transform:rotate(90deg)}
    .rule-id{font-family:var(--mono);font-size:10px;color:var(--muted)}
    .rule-name{font-weight:600;font-size:13px}
    .rule-desc{flex:1;font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .count-badge{min-width:36px;text-align:center;padding:4px 10px;border-radius:20px;font-family:var(--mono);font-weight:700;font-size:13px}
    .count-badge.warn{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
    .count-badge.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac}
    .acc-body{display:none;padding:0}
    .acc-item.open .acc-body{display:block}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--border)}
    td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    tr:hover td{background:#f8fafc}
    .crew-link{font-family:var(--mono);font-weight:600;color:var(--primary);cursor:pointer;text-decoration:none}
    .crew-link:hover{text-decoration:underline}
    .chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:4px;background:var(--amber-bg);border:1px solid var(--amber-border);font-family:var(--mono);font-size:10px;color:#92400e}
    .footer{padding:10px 16px;border-top:1px solid var(--border);text-align:right}
    .footer button{padding:6px 14px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:12px}
    .tag{position:fixed;bottom:12px;right:12px;background:#0f172a;color:#fff;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600}
    .more{color:var(--muted);font-size:11px;font-style:italic}
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="dialog">
    <div class="titlebar">
      <div class="icon">⏱</div>
      <h1><span style="font-size:10px;opacity:.75;text-transform:uppercase">Scenario</span> Roster Quality Analyzer <span class="badge">67</span></h1>
      <button class="close">×</button>
    </div>
    <div class="toolbar">
      <span>147 crew · 67 with findings</span>
      <label><input type="checkbox" checked /> Issues only</label>
    </div>
    <div class="body">
      <div class="accordion" id="accordion"></div>
    </div>
    <div class="footer"><button>Close</button></div>
  </div>
  <div class="tag">01 — Accordion Groups</div>
  <script src="shared-data.js"></script>
  <script>
    const acc = document.getElementById('accordion');
    QA_DATA.rules.forEach((rule, i) => {
      const hasIssue = rule.crewCount > 0;
      const item = document.createElement('div');
      item.className = 'acc-item' + (hasIssue ? ' has-issue open' : '');
      item.innerHTML = `
        <div class="acc-head" data-idx="${i}">
          <span class="chev">▶</span>
          <span class="rule-id">${rule.id}</span>
          <span class="rule-name">${rule.label}</span>
          <span class="rule-desc">${rule.description}</span>
          <span class="count-badge ${hasIssue ? 'warn' : 'ok'}">${rule.crewCount}</span>
        </div>
        <div class="acc-body">
          <table>
            <thead><tr>
              <th style="width:8%">Crew ID</th>
              <th style="width:12%">Base/Rank</th>
              <th style="width:14%">Lead-in CRD</th>
              <th style="width:16%">After opt</th>
              <th>Findings detail</th>
            </tr></thead>
            <tbody>
              ${rule.crew.map(c => `
                <tr>
                  <td><a class="crew-link" href="#">${c.id}</a></td>
                  <td style="font-family:var(--mono)">${c.base}/${c.rank}</td>
                  <td style="font-family:var(--mono);text-align:right">${c.leadIn || '—'}</td>
                  <td style="font-family:var(--mono)">${c.after || '—'}</td>
                  <td>${c.detail.map(d => `<span class="chip">${d}</span>`).join('')}</td>
                </tr>
              `).join('')}
              ${rule.crewCount > rule.crew.length ? `<tr><td colspan="5" class="more">+ ${rule.crewCount - rule.crew.length} more crew…</td></tr>` : ''}
            </tbody>
          </table>
        </div>`;
      acc.appendChild(item);
    });
    acc.addEventListener('click', e => {
      const head = e.target.closest('.acc-head');
      if (!head) return;
      head.parentElement.classList.toggle('open');
    });
  </script>
</body>
</html>
