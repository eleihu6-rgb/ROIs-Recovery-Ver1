<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 — Master–Detail Split</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#2563eb;--border:#e2e8f0;--muted:#64748b;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,Consolas,monospace}
    body{font-family:var(--font);font-size:12px;background:#94a3b8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45)}
    .dialog{position:relative;width:min(1200px,97vw);height:min(720px,88vh);background:#fff;border-radius:8px;box-shadow:0 24px 48px rgba(15,23,42,.2);display:flex;flex-direction:column;overflow:hidden}
    .titlebar{background:var(--primary);color:#fff;padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
    .titlebar .badge{background:#f59e0b;padding:2px 8px;border-radius:4px;font-size:11px}
    .split{display:flex;flex:1;min-height:0}
    .master{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:#f8fafc}
    .master-h{padding:10px 12px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
    .master-summary{padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)}
    .rule-nav{flex:1;overflow-y:auto;padding:6px}
    .rule-item{display:flex;align-items:flex-start;gap:8px;padding:10px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
    .rule-item:hover{background:#fff;border-color:var(--border)}
    .rule-item.on{background:#fff;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
    .rule-item .cnt{min-width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px;flex-shrink:0}
    .rule-item .cnt.warn{background:#fef3c7;color:#b45309}
    .rule-item .cnt.ok{background:#dcfce7;color:#15803d}
    .rule-item .meta{min-width:0}
    .rule-item .rid{font-family:var(--mono);font-size:10px;color:var(--muted)}
    .rule-item .name{font-weight:600;font-size:12px;margin-top:2px}
    .rule-item .hint{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
    .detail{flex:1;display:flex;flex-direction:column;min-width:0}
    .detail-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .detail-h h2{font-size:14px;font-weight:600}
    .detail-h .pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#fef3c7;color:#b45309;font-weight:600;font-family:var(--mono)}
    .detail-h .desc{flex:1;font-size:11px;color:var(--muted)}
    .detail-h input{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:11px;width:140px}
    .detail-body{flex:1;overflow-y:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:7px 12px;font-size:10px;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0;border-bottom:1px solid var(--border)}
    td{padding:8px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    tr:hover td{background:#f8fafc}
    .crew-link{font-family:var(--mono);font-weight:600;color:var(--primary);cursor:pointer}
    .chip{display:inline-block;margin:2px;padding:2px 8px;border-radius:4px;background:#fffbeb;border:1px solid #fcd34d;font-family:var(--mono);font-size:10px;color:#92400e}
    .footer{padding:8px 16px;border-top:1px solid var(--border);text-align:right}
    .footer button{padding:6px 14px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer}
    .tag{position:fixed;bottom:12px;right:12px;background:#0f172a;color:#fff;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600}
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="dialog">
    <div class="titlebar">SCENARIO Roster Quality Analyzer <span class="badge">67</span></div>
    <div class="split">
      <aside class="master">
        <div class="master-h">Quality rules</div>
        <div class="master-summary">147 crew · 67 with any finding</div>
        <div class="rule-nav" id="nav"></div>
      </aside>
      <main class="detail">
        <div class="detail-h" id="detailHead"></div>
        <div class="detail-body"><table><thead><tr>
          <th style="width:10%">Crew</th><th style="width:12%">Base/Rank</th><th style="width:12%">Lead-in</th><th style="width:12%">After opt</th><th>Offending periods</th>
        </tr></thead><tbody id="detailBody"></tbody></table></div>
      </main>
    </div>
    <div class="footer"><button>Close</button></div>
  </div>
  <div class="tag">03 — Master–Detail</div>
  <script src="shared-data.js"></script>
  <script>
    let sel = 1;
    const nav = document.getElementById('nav');
    const head = document.getElementById('detailHead');
    const body = document.getElementById('detailBody');

    function renderDetail() {
      const r = QA_DATA.rules[sel];
      head.innerHTML = `
        <h2>${r.label}</h2>
        <span class="pill">${r.crewCount} crew</span>
        <span class="desc">${r.description}</span>
        <input placeholder="Filter crew…" />`;
      body.innerHTML = r.crew.map(c => `
        <tr>
          <td><span class="crew-link">${c.id}</span></td>
          <td style="font-family:var(--mono)">${c.base}/${c.rank}</td>
          <td style="font-family:var(--mono)">${c.leadIn || '—'}</td>
          <td style="font-family:var(--mono)">${c.after || '—'}</td>
          <td>${c.detail.map(d => `<span class="chip">${d}</span>`).join('')}</td>
        </tr>`).join('');
    }

    QA_DATA.rules.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'rule-item' + (i === sel ? ' on' : '');
      el.innerHTML = `
        <div class="cnt ${r.crewCount ? 'warn' : 'ok'}">${r.crewCount}</div>
        <div class="meta">
          <div class="rid">${r.id}</div>
          <div class="name">${r.label}</div>
          <div class="hint">${r.crewCount} crew · click to view</div>
        </div>`;
      el.onclick = () => {
        sel = i;
        document.querySelectorAll('.rule-item').forEach((n, j) => n.classList.toggle('on', j === i));
        renderDetail();
      };
      nav.appendChild(el);
    });
    renderDetail();
  </script>
</body>
</html>
