<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 — Row Rail + Connector</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#eef1f5;--surface:#fff;--border:#d4dae3;--text:#1a2332;--muted:#6b7a90;
      --weekend:#2563eb;--do:#e8ecf2;--do-text:#5c6b7f;--res:#5b9fd4;
      --opt:#ea580c;--opt-rail:#fed7aa;--now:#dc2626;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,Consolas,monospace;
      --row-h:28px;--day-w:34px;--crew-w:248px;--rail-w:10px;
    }
    body{font-family:var(--font);font-size:11px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
    .chrome{height:36px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:10px;flex-shrink:0}
    .chrome .title{font-weight:700;font-size:12px}
    .chrome .pill{background:#e8f0fe;color:#1d4ed8;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
    .chrome .spacer{flex:1}
    .legend{font-size:10px;color:var(--muted);display:flex;gap:12px;margin-left:8px;align-items:center}
    .legend .rail-demo{width:24px;height:4px;background:var(--opt);border-radius:2px;position:relative}
    .legend .rail-demo::after{content:'⚡';position:absolute;right:-2px;top:-7px;font-size:9px}
    .gantt{flex:1;display:flex;overflow:hidden}
    .crew-col{width:var(--crew-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border)}
    .crew-h,.crew-row{display:grid;grid-template-columns:52px 34px 34px 28px 38px 32px;padding:0 4px;align-items:center}
    .crew-h{height:44px;border-bottom:1px solid var(--border);background:#f6f8fb;font-size:9px;text-transform:uppercase;color:var(--muted);align-items:end;padding-bottom:4px}
    .crew-row{height:var(--row-h);border-bottom:1px solid #edf0f4;font-size:10px}
    .crew-row .name{grid-column:1/-1;font-size:9px;color:var(--muted);margin-top:-2px}
    .crew-row .id{font-family:var(--mono);font-weight:600}
    .timeline-col{flex:1;overflow:auto;position:relative}
    .days{display:flex;height:44px;border-bottom:1px solid var(--border);background:#f6f8fb;position:sticky;top:0;z-index:5;min-width:max-content;padding-left:var(--rail-w)}
    .day{width:var(--day-w);flex-shrink:0;text-align:center;font-size:9px;padding-top:6px;border-right:1px solid #e8ecf2}
    .day .dow{font-size:8px;color:var(--muted)}
    .day.weekend .num,.day.weekend .dow{color:var(--weekend);font-weight:600}
    .day.rail-h{width:var(--rail-w);border-right:1px solid var(--border);background:#fff7ed}
    .rows{min-width:max-content;position:relative}
    .trow{display:flex;height:var(--row-h);border-bottom:1px solid #edf0f4;position:relative}
    .rail-lane{width:var(--rail-w);flex-shrink:0;background:#fffbf5;border-right:1px solid #fed7aa;position:relative}
    .rail-seg{position:absolute;top:50%;height:3px;background:var(--opt);border-radius:2px;transform:translateY(-50%);z-index:1}
    .rail-dot{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;margin-left:-5px;border-radius:50%;background:var(--opt);border:2px solid #fff;box-shadow:0 1px 3px rgba(234,88,12,.4);display:flex;align-items:center;justify-content:center;font-size:7px;z-index:2}
    .trow .cell{width:var(--day-w);flex-shrink:0;border-right:1px solid #f0f3f7;position:relative}
    .trow .cell.weekend{background:rgba(37,99,235,.03)}
    .blk{position:absolute;top:3px;height:22px;border-radius:3px;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
    .blk.do{background:var(--do);color:var(--do-text);border:1px solid #d0d7e2}
    .blk.res{background:var(--res);color:#fff;font-size:8px}
    .blk.flt{background:linear-gradient(90deg,#4a8fd4 0%,#4a8fd4 40%,transparent 40%);border-bottom:2px solid #22c55e}
    .blk.vac{background:#e2e8f0;color:#64748b;font-size:8px}
    /* optimized blocks: lighter tint, no corner icon — rail carries the signal */
    .blk.opt{background:#fff7ed;border:1px dashed #fdba74;color:#9a3412}
    .now{position:absolute;top:0;bottom:0;border-left:2px dashed var(--now);z-index:4;left:calc(var(--rail-w) + 24*34px)}
    .tag{position:fixed;bottom:10px;right:10px;background:#0f172a;color:#fff;padding:6px 12px;border-radius:4px;font-size:10px;font-weight:600}
    .note{position:fixed;bottom:10px;left:10px;background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:10px;color:var(--muted);max-width:300px;line-height:1.45}
    .note strong{color:var(--opt)}
  </style>
</head>
<body>
  <header class="chrome">
    <span class="title">Roster</span><span class="pill">71</span>
    <span style="font-weight:600">Jun 2026</span>
    <div class="legend">
      <span class="rail-demo"></span>
      <span>Optimizer rail links consecutive solver days</span>
    </div>
    <span class="spacer"></span>
  </header>
  <div class="gantt">
    <aside class="crew-col" id="crewCol"></aside>
    <main class="timeline-col">
      <div class="days" id="days"><div class="day rail-h"></div></div>
      <div class="rows" id="rows"><div class="now"></div></div>
    </main>
  </div>
  <div class="note"><strong>03 — Row Rail + Connector</strong><br>10px gutter rail per row; orange line + ⚡ dots on optimized days. Consecutive solver assignments read as a connected run — no hunting for micro-icons inside each cell.</div>
  <div class="tag">03 — Row Rail + Connector</div>
  <script>
    const DOW=['S','M','T','W','T','F','S'];
    const crew=[
      {id:'1824',rank:'CA',base:'YVR',sen:'12',mc:'98:20',mdo:'8',name:'Brian Mammel',blocks:[
        {d:1,w:1,t:'do'},{d:2,w:1,t:'do',opt:1},{d:3,w:1,t:'do',opt:1},{d:4,w:1,t:'flt'},{d:8,w:1,t:'res'},
        {d:12,w:1,t:'do',opt:1},{d:15,w:3,t:'flt'},{d:22,w:2,t:'do',opt:1}
      ]},
      {id:'0911',rank:'FO',base:'YVR',sen:'34',mc:'102:10',mdo:'9',name:'Robin Hughes',blocks:[
        {d:1,w:2,t:'flt'},{d:6,w:1,t:'do',opt:1},{d:7,w:1,t:'do',opt:1},{d:9,w:1,t:'res'},{d:18,w:1,t:'do',opt:1}
      ]},
      {id:'0446',rank:'IFD',base:'YVR',sen:'8',mc:'108:50',mdo:'7',name:'Crew 446',blocks:[
        {d:5,w:1,t:'do',opt:1},{d:6,w:3,t:'flt'},{d:13,w:1,t:'do',opt:1},{d:14,w:1,t:'do',opt:1},{d:24,w:1,t:'do',opt:1}
      ]},
      {id:'1204',rank:'CA',base:'YYC',sen:'21',mc:'95:00',mdo:'10',name:'Crew 1204',blocks:[
        {d:7,w:1,t:'do',opt:1},{d:15,w:1,t:'do',opt:1},{d:17,w:3,t:'flt'},{d:26,w:1,t:'res',opt:1}
      ]},
      {id:'0516',rank:'IFD',base:'YVR',sen:'15',mc:'112:05',mdo:'8',name:'Crew 516',blocks:[
        {d:7,w:2,t:'do',opt:1},{d:14,w:4,t:'flt'},{d:19,w:1,t:'do',opt:1},{d:22,w:1,t:'do',opt:1}
      ]},
      {id:'0905',rank:'FD',base:'YVR',sen:'19',mc:'134:20',mdo:'9',name:'Crew 905',blocks:[
        {d:7,w:3,t:'do',opt:1},{d:18,w:1,t:'do',opt:1},{d:25,w:3,t:'flt'}
      ]},
    ];
    const daysEl=document.getElementById('days');
    for(let d=1;d<=28;d++){
      const dt=new Date(2026,5,d);const wk=dt.getDay()===0||dt.getDay()===6;
      daysEl.innerHTML+=`<div class="day${wk?' weekend':''}"><div class="dow">${DOW[dt.getDay()]}</div><div class="num">${d}</div></div>`;
    }
    const crewCol=document.getElementById('crewCol');
    crewCol.innerHTML='<div class="crew-h"><span>CrewId</span><span>Rank</span><span>Base</span><span>Sen</span><span>MCred</span><span>MDO</span></div>';
    crew.forEach(c=>{crewCol.innerHTML+=`<div class="crew-row"><span class="id">${c.id}</span><span>${c.rank}</span><span>${c.base}</span><span>${c.sen}</span><span style="font-family:var(--mono);font-size:9px">${c.mc}</span><span>${c.mdo}</span><span class="name">${c.name}</span></div>`;});
    const rowsEl=document.getElementById('rows');
    const L={do:'DO',res:'RES',vac:'VAC'};
    const dayW=34,railW=10;
    crew.forEach(c=>{
      const rail=document.createElement('div');rail.className='rail-lane';
      const optDays=[];
      c.blocks.forEach(b=>{if(b.opt)for(let i=0;i<b.w;i++)optDays.push(b.d+i);});
      optDays.sort((a,b)=>a-b);
      let runStart=null,runEnd=null;
      const flush=()=>{
        if(runStart==null)return;
        const left=runStart-1+0.5;
        const w=runEnd-runStart+1;
        const seg=document.createElement('div');seg.className='rail-seg';
        seg.style.cssText=`left:${left*dayW}px;width:${w*dayW}px`;
        rail.appendChild(seg);
        for(let d=runStart;d<=runEnd;d++){
          const dot=document.createElement('div');dot.className='rail-dot';
          dot.style.left=`${(d-0.5)*dayW}px`;dot.textContent='⚡';
          rail.appendChild(dot);
        }
        runStart=runEnd=null;
      };
      optDays.forEach((d,i)=>{
        if(runStart==null){runStart=d;runEnd=d;return;}
        if(d===runEnd+1)runEnd=d;else{flush();runStart=d;runEnd=d;}
        if(i===optDays.length-1)flush();
      });
      let cells='';
      for(let d=1;d<=28;d++){const wk=new Date(2026,5,d).getDay()%6===0;cells+=`<div class="cell${wk?' weekend':''}"></div>`;}
      const track=document.createElement('div');track.className='trow';
      track.appendChild(rail);
      const cellWrap=document.createElement('div');
      cellWrap.style.cssText='display:flex;position:relative;flex:1';
      cellWrap.innerHTML=cells;
      track.appendChild(cellWrap);
      rowsEl.appendChild(track);
      c.blocks.forEach(b=>{
        const el=document.createElement('div');
        el.className=`blk ${b.t}${b.opt?' opt':''}`;
        el.style.cssText=`left:${railW+(b.d-1)*dayW+1}px;width:${b.w*dayW-2}px`;
        if(L[b.t])el.textContent=L[b.t];
        cellWrap.appendChild(el);
      });
    });
  </script>
</body>
</html>
