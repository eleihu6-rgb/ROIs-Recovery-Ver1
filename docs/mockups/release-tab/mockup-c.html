<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Release tab — Mockup C · Area dashboard</title>
<style>
  :root{
    --primary:#2563eb;--primary-fg:#fff;--bg:#fff;--muted:#f8fafc;--muted2:#f1f5f9;
    --border:#e2e8f0;--fg:#0f172a;--mfg:#64748b;
    --enh:#2563eb;--enh-bg:#eff6ff;--fix:#e11d48;--fix-bg:#fff1f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--muted);font-size:13px}
  .topnav{display:flex;align-items:center;gap:2px;height:40px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border)}
  .brand{font-weight:700;font-size:13px;margin-right:14px;color:var(--primary)}
  .topnav a{padding:6px 10px;color:var(--mfg);text-decoration:none;border-radius:6px;font-size:12px}
  .topnav a.active{color:var(--primary);font-weight:600;background:var(--enh-bg)}
  .topnav .spacer{flex:1}
  .ver{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--mfg)}
  .shell{display:flex;height:calc(100vh - 40px)}
  .nav{width:256px;flex-shrink:0;border-right:1px solid var(--border);background:var(--muted);overflow-y:auto}
  .nav-head{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
  .relbtn{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:10px 16px;border-bottom:1px solid var(--border)}
  .relbtn:hover{background:var(--muted2)}
  .relbtn.active{background:var(--enh-bg);border-right:2px solid var(--primary)}
  .relbtn .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .relbtn .badge{font-size:10px;font-weight:700;color:var(--primary-fg);background:var(--primary);border-radius:4px;padding:1px 6px}
  .relbtn .d{font-size:11px;color:var(--mfg);margin-top:3px}
  .relbtn.active .d{color:var(--primary)}
  .content{flex:1;overflow-y:auto;background:var(--bg)}
  .wrap{max-width:880px;margin:0 auto;padding:24px 32px 64px}
  /* hero header */
  .hero{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:linear-gradient(180deg,var(--enh-bg),var(--bg));margin-bottom:20px}
  .hero h1{font-size:21px;margin:0 0 4px}
  .hero .sub{color:#334155;font-size:13px;margin:0 0 14px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:92px}
  .stat .n{font-size:20px;font-weight:700;line-height:1}
  .stat .l{font-size:11px;color:var(--mfg);margin-top:3px}
  .stat.enh .n{color:var(--enh)} .stat.fix .n{color:var(--fix)}
  /* area section */
  .area-sec{border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--bg)}
  .area-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;background:var(--muted)}
  .area-head:hover{background:var(--muted2)}
  .area-head .icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:13px;font-weight:700}
  .area-head .name{font-size:14px;font-weight:700;flex:1}
  .area-head .cnt{font-size:11px;color:var(--mfg);font-weight:600}
  .area-head .chev{color:var(--mfg);transition:transform .15s}
  .area-sec.collapsed .chev{transform:rotate(-90deg)}
  .area-sec.collapsed .area-body{display:none}
  .area-body{padding:6px 16px 14px}
  .row{display:grid;grid-template-columns:1fr 260px;gap:18px;padding:14px 0;border-top:1px dashed var(--border)}
  .row:first-child{border-top:0}
  .row .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 7px}
  .chip.enh{color:var(--enh);background:var(--enh-bg)} .chip.fix{color:var(--fix);background:var(--fix-bg)}
  .row h3{margin:0;font-size:14px;font-weight:600}
  .row p{margin:5px 0 0;color:#334155;line-height:1.5;font-size:13px}
  .row .media img{width:100%;border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .row .media .cap{font-size:11px;color:var(--mfg);font-style:italic;margin-top:5px;text-align:center}
  .row .media .noshot{border:1px dashed #cbd5e1;border-radius:8px;color:var(--mfg);font-size:11px;padding:14px 10px;text-align:center;background:var(--muted)}
  @media(max-width:760px){.row{grid-template-columns:1fr}}
  .tag{position:fixed;left:10px;bottom:10px;background:#0f172a;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;opacity:.85}
</style>
</head>
<body>
  <div class="topnav">
    <span class="brand">ROIS · Gantt</span>
    <a>Dashboard</a><a>Live</a><a>Scenario</a><a>Rule</a><a>Data</a><a>System</a><a>Regression</a><a>Help</a><a class="active">Release</a>
    <span class="spacer"></span>
    <span class="ver">Ver:B80/F168/R18</span>
  </div>
  <div class="shell">
    <aside class="nav">
      <div class="nav-head">📣&nbsp; Release Notes</div>
      <div id="tree"></div>
    </aside>
    <main class="content"><div class="wrap" id="wrap"></div></main>
  </div>
  <div class="tag">Mockup C — Area-grouped dashboard</div>

<script src="_data.js"></script>
<script>
  let active = 0;
  const AREA_ICON = {Live:'L',Pairing:'P',Scenario:'S',Rule:'R',Data:'D',Global:'G',Regression:'T'};
  function renderTree(){
    document.getElementById('tree').innerHTML = RELEASES.map((r,i)=>`
      <button class="relbtn ${i===active?'active':''}" onclick="select(${i})">
        <div class="t"><span class="badge">Rel ${r.n}</span> ${r.date}</div>
        <div class="d">${r.items.length} changes · ${r.version}</div>
      </button>`).join('');
  }
  function media(it){
    if(it.shot) return `<div class="media"><img src="${SHOT_BASE}${it.shot}" alt=""><div class="cap">${it.cap}</div></div>`;
    return `<div class="media"><div class="noshot">📸 Snapshot<br>to be captured</div></div>`;
  }
  function row(it){
    return `<div class="row">
      <div><div class="top"><span class="chip ${it.type}">${it.type==='enh'?'Enhancement':'Bug fix'}</span></div>
        <h3>${it.title}</h3><p>${it.body}</p></div>
      ${media(it)}</div>`;
  }
  function toggle(el){el.closest('.area-sec').classList.toggle('collapsed');}
  function select(i){active=i;renderTree();renderWrap();document.querySelector('.content').scrollTo(0,0);}
  function renderWrap(){
    const r=RELEASES[active];
    const enh=r.items.filter(x=>x.type==='enh').length, fix=r.items.filter(x=>x.type==='fix').length;
    const areas=[...new Set(r.items.map(x=>x.area))];
    const secs = areas.map(a=>{
      const list=r.items.filter(x=>x.area===a);
      return `<section class="area-sec">
        <div class="area-head" onclick="toggle(this)">
          <span class="icon">${AREA_ICON[a]||a[0]}</span>
          <span class="name">${a}</span>
          <span class="cnt">${list.length} change${list.length>1?'s':''}</span>
          <span class="chev">▾</span>
        </div>
        <div class="area-body">${list.map(row).join('')}</div>
      </section>`;
    }).join('');
    document.getElementById('wrap').innerHTML = `
      <div class="hero">
        <h1>Rel ${r.n} — ${r.date}</h1>
        <p class="sub">${r.summary}</p>
        <div class="stats">
          <div class="stat enh"><div class="n">${enh}</div><div class="l">Enhancements</div></div>
          <div class="stat fix"><div class="n">${fix}</div><div class="l">Bug fixes</div></div>
          <div class="stat"><div class="n">${areas.length}</div><div class="l">Areas touched</div></div>
        </div>
      </div>
      ${secs}`;
  }
  renderTree();renderWrap();
</script>
</body>
</html>
