<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Release tab — Mockup A · Help-mirror</title>
<style>
  :root{
    --primary:#2563eb;--primary-fg:#fff;--bg:#fff;--muted:#f8fafc;--muted2:#f1f5f9;
    --border:#e2e8f0;--fg:#0f172a;--mfg:#64748b;
    --enh:#2563eb;--enh-bg:#eff6ff;--fix:#e11d48;--fix-bg:#fff1f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--muted);font-size:13px}
  /* top nav */
  .topnav{display:flex;align-items:center;gap:2px;height:40px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border)}
  .brand{font-weight:700;font-size:13px;margin-right:14px;color:var(--primary)}
  .topnav a{padding:6px 10px;color:var(--mfg);text-decoration:none;border-radius:6px;font-size:12px}
  .topnav a.active{color:var(--primary);font-weight:600;background:var(--enh-bg)}
  .topnav .spacer{flex:1}
  .ver{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--mfg)}
  /* layout */
  .shell{display:flex;height:calc(100vh - 40px)}
  .nav{width:256px;flex-shrink:0;border-right:1px solid var(--border);background:var(--muted);overflow-y:auto}
  .nav-head{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
  .relbtn{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:10px 16px;border-bottom:1px solid var(--border)}
  .relbtn:hover{background:var(--muted2)}
  .relbtn.active{background:var(--enh-bg);border-right:2px solid var(--primary)}
  .relbtn .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .relbtn .badge{font-size:10px;font-weight:700;color:var(--primary-fg);background:var(--primary);border-radius:4px;padding:1px 6px}
  .relbtn .d{font-size:11px;color:var(--mfg);margin-top:3px}
  .relbtn.active .d{color:var(--primary)}
  /* content */
  .content{flex:1;overflow-y:auto;background:var(--bg)}
  .article{max-width:760px;margin:0 auto;padding:28px 32px 64px}
  .crumb{font-size:11px;color:var(--mfg);margin-bottom:6px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mfg);font-size:13px;margin:0 0 8px}
  .meta{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--mfg);background:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:inline-block;margin-bottom:22px}
  .secthead{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:15px;font-weight:700}
  .secthead .dot{width:8px;height:8px;border-radius:50%}
  .secthead.enh .dot{background:var(--enh)} .secthead.fix .dot{background:var(--fix)}
  .secthead .count{font-size:11px;font-weight:600;color:var(--mfg)}
  .item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--bg)}
  .item .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 7px}
  .chip.enh{color:var(--enh);background:var(--enh-bg)} .chip.fix{color:var(--fix);background:var(--fix-bg)}
  .area{font-size:11px;font-weight:600;color:var(--mfg);background:var(--muted2);border-radius:5px;padding:2px 7px}
  .item h3{margin:0;font-size:14px;font-weight:600}
  .item p{margin:6px 0 0;color:#334155;line-height:1.5;font-size:13px}
  figure{margin:12px 0 0;text-align:center}
  figure img{max-width:100%;border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  figcaption{font-size:11px;color:var(--mfg);font-style:italic;margin-top:6px}
  .noshot{border:1px dashed #cbd5e1;border-radius:8px;color:var(--mfg);font-size:11px;padding:10px;text-align:center;margin-top:12px;background:var(--muted)}
  .tag{position:fixed;left:10px;bottom:10px;background:#0f172a;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;opacity:.85}
</style>
</head>
<body>
  <div class="topnav">
    <span class="brand">ROIS · Gantt</span>
    <a>Dashboard</a><a>Live</a><a>Scenario</a><a>Rule</a><a>Data</a><a>System</a><a>Regression</a><a>Help</a><a class="active">Release</a>
    <span class="spacer"></span>
    <span class="ver">Ver:B80/F168/R18</span>
  </div>
  <div class="shell">
    <aside class="nav">
      <div class="nav-head">📣&nbsp; Release Notes</div>
      <div id="tree"></div>
    </aside>
    <main class="content"><div class="article" id="article"></div></main>
  </div>
  <div class="tag">Mockup A — Help-mirror (grouped sections)</div>

<script src="_data.js"></script>
<script>
  let active = 0;
  function renderTree(){
    document.getElementById('tree').innerHTML = RELEASES.map((r,i)=>`
      <button class="relbtn ${i===active?'active':''}" onclick="select(${i})">
        <div class="t"><span class="badge">Rel ${r.n}</span> ${r.date}</div>
        <div class="d">${r.items.length} changes · ${r.version}</div>
      </button>`).join('');
  }
  function shot(it){
    if(it.shot) return `<figure><img src="${SHOT_BASE}${it.shot}" alt=""><figcaption>${it.cap}</figcaption></figure>`;
    return `<div class="noshot">📸 Snapshot to be captured for this change</div>`;
  }
  function itemCard(it){
    return `<div class="item">
      <div class="top"><span class="chip ${it.type}">${it.type==='enh'?'Enhancement':'Bug fix'}</span>
        <span class="area">${it.area}</span></div>
      <h3>${it.title}</h3><p>${it.body}</p>${shot(it)}
    </div>`;
  }
  function select(i){active=i;renderTree();renderArticle();document.querySelector('.content').scrollTo(0,0);}
  function renderArticle(){
    const r = RELEASES[active];
    const enh = r.items.filter(x=>x.type==='enh'), fix = r.items.filter(x=>x.type==='fix');
    const sec = (cls,label,arr)=> arr.length? `
      <div class="secthead ${cls}"><span class="dot"></span>${label}<span class="count">${arr.length}</span></div>
      ${arr.map(itemCard).join('')}` : '';
    document.getElementById('article').innerHTML = `
      <div class="crumb">Release Notes › Rel ${r.n}</div>
      <h1>Rel ${r.n} — ${r.date}</h1>
      <p class="sub">${r.summary}</p>
      <div class="meta">Commits ${r.range} · ${r.version}</div>
      ${sec('enh','Enhancements',enh)}
      ${sec('fix','Bug fixes',fix)}`;
  }
  renderTree();renderArticle();
</script>
</body>
</html>
