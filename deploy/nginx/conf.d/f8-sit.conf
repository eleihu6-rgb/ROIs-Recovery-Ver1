upstream crew-f8-sit-report-api {
    least_conn;
    server 10.15.12.4:5101 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl;
    server_name crew-f8-usva-sit.roiscloud.com;

    location = / { return 302 /altair/; }

    ssl_certificate      /home/piercrew/software/web/ssl/roiscloud.com.pem;
    ssl_certificate_key  /home/piercrew/software/web/ssl/roiscloud.com.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gantt SPA — https://crew-f8-usva-sit.roiscloud.com/altair ────────────
    # SPA shell (index.html) must NOT be cached, otherwise after deploy the
    # browser keeps an old entry that still imports deleted hashed chunks
    # (e.g. scenario-pairing-pane-*.js) → "Failed to fetch dynamically imported module".
    # Hashed /assets/* remain long-cache + immutable (filename is content-hash).

    location = /altair { return 301 /altair/; }
    location = /altair/ {
        # directory URI cannot alias a bare file → rewrite to index.html
        rewrite ^ /altair/index.html last;
    }
    location = /altair/index.html {
        alias /home/rois/sit/gantt/index.html;
        default_type text/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /altair/assets/ {
        alias /home/rois/sit/gantt/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /altair/ {
        alias /home/rois/sit/gantt/;
        index index.html;
        # NB: no "$uri/" here — the built dist has real help/ and release/ dirs
        # (screenshots) that shadow the SPA routes /altair/help and /altair/release;
        # serving the dir as-is returns 403. Unknown paths must fall to the SPA.
        try_files $uri /altair/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── PBS Portal — https://crew-f8-usva-sit.roiscloud.com/pbs ──────────────

    location = /pbs { return 301 /pbs/; }
    location = /pbs/ {
        rewrite ^ /pbs/index.html last;
    }
    location = /pbs/index.html {
        alias /home/rois/sit/pbs/index.html;
        default_type text/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /pbs/assets/ {
        alias /home/rois/sit/pbs/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /pbs/ {
        alias /home/rois/sit/pbs/;
        index index.html;
        try_files $uri $uri/ /pbs/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── rois-ai services (SIT Server 10.15.12.4) ─────────────────────────────
    # gantt:      VITE_API_PREFIX=  → /live/* /rule/* /engine/* /ai/*
    # pbs-portal: VITE_API_BASE_URL=/pbs/api → /pbs/api/*

    location ^~ /pbs/api/ {
        proxy_pass http://10.15.12.4:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /live/ {
        proxy_pass http://10.15.12.4:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
#     location ^~ /rule/ {
#         proxy_pass http://10.15.12.4:3001/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_http_version 1.1;
#         proxy_connect_timeout 60s;
#         proxy_read_timeout 300s;
#         proxy_send_timeout 300s;
#     }
    location ^~ /engine/ {
        proxy_pass http://10.15.12.4:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
#     location ^~ /ai/ {
#         proxy_pass http://10.15.12.4:3005/ai/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_http_version 1.1;
#         proxy_connect_timeout 60s;
#         proxy_read_timeout 300s;
#         proxy_send_timeout 300s;
#     }
    include /home/yuan.z/rois/conf.d/gitnexus.conf;

    # ── PBS Report — https://crew-f8-usva-sit.roiscloud.com/report ────────────

    location = /report { return 301 /report/; }
    location = /report/ {
        rewrite ^ /report/index.html last;
    }
    location = /report/index.html {
        alias /home/rois/sit/report/index.html;
        default_type text/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /report/assets/ {
        alias /home/rois/sit/report/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /report/api/ {
        proxy_pass http://crew-f8-sit-report-api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /report/ {
        alias /home/rois/sit/report/;
        index index.html;
        try_files $uri $uri/ /report/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
