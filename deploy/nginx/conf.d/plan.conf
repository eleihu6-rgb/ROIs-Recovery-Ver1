server {
    listen 443 ssl;
    server_name crew-f8-usva-tst.roiscloud.com;

    ssl_certificate      /home/piercrew/software/web/ssl/roiscloud.com.pem;
    ssl_certificate_key  /home/piercrew/software/web/ssl/roiscloud.com.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    location = /project { return 302 /; }
    location = /project/ { return 302 /; }

    # PentAGI 深测 UI 改由独立域名访问（conf.d/pentagi.conf：crew-f8-usva-penai.roiscloud.com → 10.15.12.4:8081）。
    # 曾尝试 443 子路径 /pentagi/（sub_filter 改写 JS bundle + proxy_cookie_path），但因 PentAGI 前端
    # 硬编码根绝对路径且 nginx 无法表达字面反引号，方案先天脆弱，已于域名就绪后整体删除。
    location / {
        proxy_pass http://10.15.12.4:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# PentAGI 深测 UI —— 同 hostname 独立端口 8443 → PortalServer 10.15.12.4:8081。
# 443 根路径仍归 Plane（10.15.12.4:8080）；PentAGI 前端硬编码 /api/v1 且资源路径根绝对，
# 无法挂子路径，故用 8443 占根路径。访问 https://crew-f8-usva-tst.roiscloud.com:8443/
server {
    listen 8443 ssl;
    server_name crew-f8-usva-tst.roiscloud.com;

    ssl_certificate      /home/piercrew/software/web/ssl/roiscloud.com.pem;
    ssl_certificate_key  /home/piercrew/software/web/ssl/roiscloud.com.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://10.15.12.4:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
