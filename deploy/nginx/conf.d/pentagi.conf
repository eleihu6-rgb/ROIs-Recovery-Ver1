# PentAGI 深度渗透 UI 反向代理（PortalServer 10.15.12.4:8081）
# 独立 hostname：PentAGI 前端硬编码 /api/v1 + 根绝对资源路径，子路径代理会坏，
# 必须占根路径 —— 这也是 443 上 /pentagi/ 子路径方案（plan.conf，sub_filter 改写
# JS bundle）始终脆弱的根因。域名方案下不需要任何 sub_filter / cookie path 改写。
# DNS：crew-f8-usva-penai.roiscloud.com → WebServer 47.89.181.217（已生效）
server {
    listen 443 ssl;
    server_name crew-f8-usva-penai.roiscloud.com;

    ssl_certificate      /home/piercrew/software/web/ssl/roiscloud.com.pem;
    ssl_certificate_key  /home/piercrew/software/web/ssl/roiscloud.com.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://10.15.12.4:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
    }
}
