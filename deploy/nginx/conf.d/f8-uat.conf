    # ── Gantt SPA — https://crew-f8-usva-uat.roiscloud.com/altair ────────────

    location = /altair { return 301 /altair/; }
    location ^~ /altair/assets/ {
        alias /home/rois/uat/gantt/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /altair/ {
        alias /home/rois/uat/gantt/;
        index index.html;
        # NB: no "$uri/" here — the built dist has real help/ and release/ dirs
        # (screenshots) that shadow the SPA routes /altair/help and /altair/release;
        # serving the dir as-is returns 403. Unknown paths must fall to the SPA.
        try_files $uri /altair/index.html;
        # UAT 维护模式：maintenance.flag 存在时，整个 /altair/ SPA 返回 503 并渲染
        # 维护页（deploy/nginx/maintenance.html，经 rois.sh maintain on 部署到
        # /home/rois/uat/maintenance.html）。只挡前端；/live /rule /engine /ai
        # /pbs/api 后端代理不受影响，维护期间可继续手工导数据。
        if (-f /home/rois/uat/maintenance.flag) { return 503; }
        # ── 安全响应头（pentest #15/#19/#20/#21/#22）──
        # CSP: 现代 SPA 全部自托管（self），WebSocket 同源经 nginx 反代（ws/wss）。
        # script-src 'self'（无 inline/eval）；style 允许内联（React inline style）。
        # frame-ancestors 'none' + X-Frame-Options DENY 双重防点击劫持。
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    error_page 503 @altair_maintenance;
    location @altair_maintenance {
        internal;
        default_type text/html;
        # NB: alias is forbidden inside a named location — use root + try_files
        # (try_files path resolves against root → /home/rois/uat/maintenance.html).
        root /home/rois/uat;
        try_files /maintenance.html =404;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

