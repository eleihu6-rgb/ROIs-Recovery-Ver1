# ============================================================
# SIT 环境 nginx location 块
# 文件：deploy/sit/nginx/sit.conf
#
# 使用方法：
#   在 WebServer (10.15.12.2) 上，将下面的 location 块加入现有的
#   server {} 块中（通常是 /etc/nginx/conf.d/f8.conf 或类似文件）。
#   加完后执行: sudo nginx -t && sudo nginx -s reload
#
# 后端地址：PortalServer = 10.15.12.4
#   live-server  → :3000
#   pbs-server   → :3002
#   engine-server → :3003
# ============================================================

    # ── SIT 静态前端 ──────────────────────────────────────────────

    location /altair/ {
        alias /home/rois/sit/gantt/;
        try_files $uri $uri/ @sit_gantt_fallback;
        expires 7d;
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    location @sit_gantt_fallback {
        rewrite ^ /altair/index.html break;
        root /home/rois/sit;
    }

    location /pbs/ {
        alias /home/rois/sit/pbs/;
        try_files $uri $uri/ @sit_pbs_fallback;
        expires 7d;
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    location @sit_pbs_fallback {
        rewrite ^ /pbs/index.html break;
        root /home/rois/sit;
    }

    # ── SIT 后端 API 代理 ─────────────────────────────────────────
    # gantt 使用 VITE_API_PREFIX= → 调用路径为 /live/* /rule/* /engine/* /ai/*
    # pbs-portal 使用 VITE_API_BASE_URL=/pbs/api → 调用路径为 /pbs/api/*

    location /live/ {
        proxy_pass http://10.15.12.4:3000/;
        proxy_http_version 1.1;
        # WebSocket 支持（live-server 使用 WS 推送锁状态）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /rule/ {
        proxy_pass http://10.15.12.4:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /engine/ {
        proxy_pass http://10.15.12.4:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        proxy_pass http://10.15.12.4:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /pbs/api/ {
        proxy_pass http://10.15.12.4:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
