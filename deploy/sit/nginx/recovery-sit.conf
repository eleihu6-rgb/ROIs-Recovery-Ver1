# ============================================================
# 本机 nginx 配置 — SIT 部署 WebServer 侧
# 文件：deploy/sit/nginx/recovery-sit.conf
#
# 用法（在本机执行）：
#   sudo cp deploy/sit/nginx/recovery-sit.conf /etc/nginx/conf.d/recovery-sit.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 拓扑：
#   本机 (WebServer / dev 工作站, nginx 1.26.2): 提供 /altair/ 静态 gantt SPA + 反向代理后端
#   PortalServer (10.16.11.18, ecs-user + sudo NOPASSWD): 运行 live-server(:3000) /
#                                   engine-server(:3003) + postgres:17-alpine (:5432) +
#                                   redis:7-alpine (:6379) 全部跑在该机 Docker 中
#                                   (rule-engine-rs 二进制由 live-server 内部 spawn 调用)
#
# 部署范围（裁剪版）：
#   gantt SPA + live-server + engine-server + postgres + redis（全部在 10.16.11.18）
# 不在范围：pbs-server / pbs-portal / connector-server / ai-server / rule-engine HTTP endpoint
#           (rule-engine-rs 的二进制由 live-server 通过 spawn 调用，不单独开 HTTP 端口)
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # 根路径直接跳转 gantt
    location = / { return 302 /altair/; }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # ── Gantt SPA — http://<host>/altair ────────────────────────────
    # SPA shell (index.html) must NOT be cached, otherwise after deploy the
    # browser keeps an old entry that still imports deleted hashed chunks
    # → "Failed to fetch dynamically imported module".
    # Hashed /assets/* remain long-cache + immutable (filename is content-hash).

    location = /altair { return 301 /altair/; }
    location = /altair/ {
        # directory URI cannot alias a bare file → rewrite to index.html
        rewrite ^ /altair/index.html last;
    }
    location = /altair/index.html {
        alias /home/recovery/sit/gantt/index.html;
        default_type text/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
    location ^~ /altair/assets/ {
        alias /home/recovery/sit/gantt/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location ^~ /altair/ {
        alias /home/recovery/sit/gantt/;
        index index.html;
        # NB: no "$uri/" here — the built dist has real help/ and release/ dirs
        # that shadow the SPA routes /altair/help and /altair/release.
        try_files $uri /altair/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── live-server API proxy ───────────────────────────────────────
    # gantt uses VITE_API_PREFIX= → calls paths like /live/* /engine/*
    location /live/ {
        proxy_pass http://10.16.11.18:3000/;
        proxy_http_version 1.1;
        # WebSocket (live-server pushes lock state over WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ── engine-server API proxy ─────────────────────────────────────
    location /engine/ {
        proxy_pass http://10.16.11.18:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

