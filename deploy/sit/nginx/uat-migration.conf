# ============================================================
# UAT 前端路径迁移说明
# 文件：deploy/dev/nginx/uat-migration.conf
#
# UAT 前端文件从 /home/yuan.z/rois/gantt/ 和 /home/yuan.z/rois/pbs/
# 迁移到 /home/yuan.z/rois/uat/gantt/ 和 /home/yuan.z/rois/uat/pbs/
#
# 在 WebServer nginx 配置中，找到 /altair/ 和 /fpqe/pbs/ 的 location 块，
# 将 alias / root 路径从旧路径改为下方的新路径。
#
# UAT 后端（CoreServer）的 proxy 配置无需改动。
# ============================================================

    # ── UAT Gantt（修改 alias 路径） ─────────────────────────────
    # 原配置（旧）：
    #   alias /home/yuan.z/rois/gantt/;
    # 改为（新）：
    location /altair/ {
        alias /home/yuan.z/rois/uat/gantt/;
        try_files $uri $uri/ @uat_gantt_fallback;
        expires 7d;
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    location @uat_gantt_fallback {
        rewrite ^ /altair/index.html break;
        root /home/yuan.z/rois/uat;
    }

    # ── UAT PBS（修改 alias 路径） ───────────────────────────────
    # 原配置（旧）：
    #   alias /home/yuan.z/rois/pbs/;
    # 改为（新）：
    location /fpqe/pbs/ {
        alias /home/yuan.z/rois/uat/pbs/;
        try_files $uri $uri/ @uat_pbs_fallback;
        expires 7d;
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    location @uat_pbs_fallback {
        rewrite ^ /fpqe/pbs/index.html break;
        root /home/yuan.z/rois/uat;
    }

    # ── UAT 后端 API（CoreServer — 无需改动，仅供参考） ──────────
    # location /fpqe/live/ { proxy_pass http://10.15.12.3:3000/; ... }
    # location /fpqe/rule/ { proxy_pass http://10.15.12.3:3001/; ... }
