appId: org.reactjs.native.example.RoyceTravelTemplate
# Phase B: AsyncStorage is unwritable at this point (host made the storage
# directory read-only), so the roster snapshot cannot be persisted. Sign-in must
# still succeed with the in-memory session — and since 2026-09-11 it does so
# silently: the "could not save your login" pop-up was removed at Ryan's request.
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
- tapOn:
    id: "airline-dropdown"
- tapOn:
    id: "airline-ET"
- assertVisible:
    id: "crew-id"
- scrollUntilVisible:
    element:
      id: "login-btn"
    direction: DOWN
- tapOn:
    id: "login-btn"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- takeScreenshot: ver_storage_failure_home
