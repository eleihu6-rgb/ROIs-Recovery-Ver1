appId: org.reactjs.native.example.RoyceTravelTemplate
# Phase B: AsyncStorage is unwritable at this point (host made the storage
# directory read-only), so the roster snapshot cannot be persisted. Sign-in must
# still succeed with the in-memory session and the soft "not saved" notice.
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
- tapOn:
    id: "airline-dropdown"
- tapOn:
    id: "airline-ET"
- assertVisible:
    id: "crew-id"
- scrollUntilVisible:
    element:
      id: "login-btn"
    direction: DOWN
- tapOn:
    id: "login-btn"
- extendedWaitUntil:
    visible: ".*could not save your login.*"
    timeout: 30000
- takeScreenshot: ver_storage_failure_notice
- tapOn: "OK"
- extendedWaitUntil:
    visible: "Next Adventure"
    timeout: 30000
- takeScreenshot: ver_storage_failure_home
