# Emirates default-login + Schedule proof.
#
# The Emirates option no longer reads the retired EVACC C9000xx demo gateway:
# it signs the crew in through the ROIS live-server mobile-roster contract
# (POST /api/mobile-roster/session), so a REAL Emirates crew can log in "as EK".
# The picker's default login is crew K1003 (Khalid Al Nuaimi, CA, A380, DXB).
# This flow proves: login-screen → EK → default K1003 prefill → log in → Home →
# Schedule tab shows the crew's real September 2026 Emirates roster.
#
# Run: cd crew-app && maestro test .maestro/ek_login.yaml
appId: org.reactjs.native.example.RoyceTravelTemplate
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "airline-dropdown"
- extendedWaitUntil:
    visible:
      id: "airline-EK"
    timeout: 15000
- tapOn:
    id: "airline-EK"
# Choosing Emirates pre-fills the EK default crew id — real crew K1003.
- assertVisible:
    id: "crew-id"
- assertVisible: "K1003"
- assertVisible:
    id: "crew-pw"
- takeScreenshot: ek_login_00_default
- tapOn:
    id: "login-btn"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 240000
- tapOn:
    text: "Dismiss"
    optional: true
- takeScreenshot: ek_login_01_home

# Schedule — the crew's real Emirates roster (DXB base).
- tapOn:
    id: "tab-schedule"
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "tab-schedule"
- extendedWaitUntil:
    visible:
      id: "sched-list"
    timeout: 30000
- assertVisible:
    id: "sched-title"
- takeScreenshot: ek_login_02_schedule
# Find a duty in the month list: EK763 (DXB→JNB) is on K1003's real roster.
- scrollUntilVisible:
    element:
      id: "duty-EK763"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "duty-EK763"
- takeScreenshot: ek_login_03_schedule_ek763

# The other two Schedule views render from the same month model.
- tapOn:
    id: "sched-view-menu"
- tapOn:
    id: "sched-view-calendar"
- extendedWaitUntil:
    visible:
      id: "cal-grid"
    timeout: 15000
- takeScreenshot: ek_login_04_calendar
- tapOn:
    id: "sched-view-menu"
- tapOn:
    id: "sched-view-route"
- extendedWaitUntil:
    visible:
      id: "route-map"
    timeout: 15000
- takeScreenshot: ek_login_05_route_map
