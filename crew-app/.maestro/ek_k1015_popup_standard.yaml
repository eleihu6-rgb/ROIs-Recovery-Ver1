- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 240000
- tapOn:
    text: "Dismiss"
    optional: true
- swipe:
    start: 50%, 84%
    end: 50%, 30%
    duration: 400
- tapOn:
    id: "qa-absence"
- assertVisible:
