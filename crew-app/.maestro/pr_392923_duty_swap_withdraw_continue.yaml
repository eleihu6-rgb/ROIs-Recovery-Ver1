# Continues pr_392923_duty_swap_send_withdraw.yaml (no relaunch): from the
# "Request sent" dialog → Swap requests → the request reads "Waiting for the
# other crew" → Withdraw → confirm → "Withdrawn by you".
appId: org.reactjs.native.example.RoyceTravelTemplate
---
# "View requests" pill (inside the AppDialog card: tap by position).
- tapOn:
    point: "62%,60%"
- extendedWaitUntil:
    visible:
      id: "swap-records-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ".*Waiting for the other crew.*"
    timeout: 30000
- assertVisible:
    text: ".*You give 13-Oct-2026.*take 12-Oct-2026.*"
- takeScreenshot: duty-swap-records-pending-air-Ver1
# Withdraw sits inside the record card's single accessibility element.
- tapOn:
    point: "79%,27%"
- extendedWaitUntil:
    visible:
      id: "records-dialog"
    timeout: 10000
- takeScreenshot: duty-swap-withdraw-confirm-air-Ver1
# "Withdraw" pill (destructive) inside the dialog card.
- tapOn:
    point: "62%,59%"
- extendedWaitUntil:
    visible:
      text: ".*Request withdrawn.*"
    timeout: 30000
