appId: org.reactjs.native.example.RoyceTravelTemplate
# Crew Recovery Story 101 follow-up (Ryan, 2026-09-13) — Absence Request ▸
# top-right history icon.
#
# Proves the crew-visible outcome: the icon opens "Absence History" scoped to the
# CURRENT calendar month and lists J4002's real SIT requests (11 Sep active,
# 24 Sep cancelled by recovery). Read-only — this flow writes no absence.
#
# Run: cd crew-app && maestro test .maestro/et_j4002_absence_history.yaml
# The app remembers the last airline in the Keychain across `clearState`, so the
# picker is tapped explicitly. Reset a stale session first with:
#   xcrun simctl keychain <udid> reset
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "airline-dropdown"
- tapOn:
    id: "airline-ET"
- assertVisible:
    id: "crew-id"
- assertVisible: "J4002"
- tapOn:
    id: "toggle-pw"
- assertVisible: "Pier2026"
- scrollUntilVisible:
    element:
      id: "login-btn"
    direction: DOWN
- tapOn:
    id: "login-btn"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
# The dev LogBox keychain warning covers the dock after login.
- tapOn:
    text: "Dismiss"
    optional: true
# Home scrolls under the floating dock; the Quick actions panel is the last block.
- swipe:
    start: 50%, 84%
    end: 50%, 30%
    duration: 400
- tapOn:
    id: "qa-absence"
- assertVisible:
    id: "page-absence"
# The new entry point sits in the header, top right.
- assertVisible:
    id: "absence-history"
- takeScreenshot: absence-history-Ver1-00-icon
- tapOn:
    id: "absence-history"
- assertVisible:
    id: "page-absence-history"
- assertVisible: "Absence History"
# Scope + the two real requests this month, with their outcomes. Maestro matches
# the whole element text, and the month label uses the SectionLabel style, so it
# reads uppercased.
- assertVisible: "SEP 2026 · 2 REQUESTS"
- assertVisible: "Sick leave"
- assertVisible: "Cancelled"
- assertVisible: "Active"
- assertVisible: "24 Sep 2026"
- assertVisible: "11 Sep 2026"
- takeScreenshot: absence-history-Ver1-01-list
# Back chevron returns to the form the crew was filing.
- tapOn:
    id: "page-back"
- assertVisible:
    id: "page-absence"
- assertVisible: "Report an absence"
