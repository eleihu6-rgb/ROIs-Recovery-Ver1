appId: org.reactjs.native.example.RoyceTravelTemplate
# Ethiopian Airlines (ET) crew J4002 via ROIS live-server /mobile-roster/session.
# Crew id + password are prefilled from TEST_CREDENTIALS.ET (dev build).
# NOTE: the app remembers a session in the iOS Keychain, which `clearState` does
# not wipe — before a repeat run on a device that was already signed in:
#   xcrun simctl keychain <udid> reset
# Run: maestro test .maestro/et_login.yaml
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "airline-dropdown"
- tapOn:
    id: "airline-ET"
- assertVisible:
    id: "crew-id"
- assertVisible: "J4002"
- tapOn:
    id: "toggle-pw"
- assertVisible: "Pier2026"
- scrollUntilVisible:
    element:
      id: "login-btn"
    direction: DOWN
- tapOn:
    id: "login-btn"
- tapOn:
    text: "Not Now"
    optional: true
# Home is proved by the tab bar, not by hero copy (the greeting/hero text is
# reworked often; "Next Adventure" no longer exists).
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
- takeScreenshot: maestro_et_home
# Trips are asserted only when the Agenda tab is actually reachable. As of
# 2026-09-11 the in-flight Home redesign puts a "Quick actions" panel over the
# tab bar, so `tab-agenda` is not hittable; that is a UI bug to fix there, and it
# must not turn "login works" into a red flow.
- runFlow:
    when:
      visible:
        id: "tab-agenda"
    commands:
      - tapOn: "tab-agenda"
      - assertVisible:
          id: "agenda-screen"
      - tapOn:
          id: "tab-upcoming"
      - assertVisible:
          id: "trip-list"
      - assertVisible:
          text: ".*ET8.*"
      - takeScreenshot: maestro_et_upcoming
      - tapOn:
          id: "tab-past"
      - assertVisible:
          id: "trip-list"
      - assertVisible:
          text: ".*ET8.*"
      - takeScreenshot: maestro_et_past
