[comments]
#expect_legal:是否预期违规
#pairing:     航班序列，每行一个seg，DUTY或空行表示 旧duty结束新duty开始
#time_format: 时间默认按ACT
#duty node: pickup|brief只标记开始时间, debrief|dropoff只标记结束时间
#*** FDP特有参数 ***: expectFDP=hh:mm, 
#*** 2107法规参数 **: IS PICKUP COUNT, IS DROPOFF COUNT, IS PRE-FERRY COUNT, IS POST-FERRY COUNT, INCLUDE CHECK OUT, INCLUDE CHECK IN, INCLUDE LT CHECK OUT
#*** 2102法规参数 **: INBOUND(D|I|R), OUTBOUND, IN ASSIGNMENT, OUT ASSIGNMENT, MAX TURNTIME, PSEUDO BRIEF, PSEUDO DEBRIEF, PICK UP, DROP OFF, FLEETS

[normal]
expectFDP=06:30
#rule 2107, for duty FDP
IS PICKUP COUNT=N
IS DROPOFF COUNT=N
IS PRE-FERRY COUNT=N
IS POST-FERRY COUNT=N
INCLUDE CHECK OUT=N
INCLUDE CHECK IN=Y
INCLUDE LT CHECK OUT=Y
#rule 2102, for longtransit
INBOUND=D
OUTBOUND=D
IN ASSIGNMENT=*
OUT ASSIGNMENT=*
MAX TURNTIME=03:30
PSEUDO BRIEF=00:90
PSEUDO DEBRIEF=00:30
PICK UP=00:00
DROP OFF=00:00
FLEETS=*
pairing=
DUTY
PICKUP,2017-1-1 06:30:00
BRIEF,2017-1-1 06:30:00
FLY,9800,PEK,SHA,2017-1-1 08:00:00,2017-1-1 10:00:00
FLY,9801,SHA,CAN,2017-1-1 11:00:00,2017-1-1 13:00:00
DEBRIEF,2017-1-1 13:30:00
DROPOFF,2017-1-1 13:30:00


