<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>RESTful API demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
        * {
            outline: none;
        }

        body {
            background-color: #789;
            margin: 0;
            padding: 0;
            font: 16px/1.4 Helvetica, Arial, sans-serif;
            font: 16px/1.4 Helvetica, Arial, sans-serif;
        }

        div.content {
            width: 800px;
            margin: 2em auto;
            padding: 20px 50px;
            background-color: #fff;
            border-radius: 1em;
        }

        label {
            display: inline-block;
            min-width: 7em;
        }

        input {
            border: 1px solid #ccc;
            padding: 0.2em;
        }

        a:link, a:visited {
            color: #69c;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            body {
                background-color: #fff;
            }

            div.content {
                width: auto;
                margin: 0 auto;
                padding: 1em;
            }
        }
    </style>

    <script src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <script language="javascript" type="text/javascript">
        jQuery(function () {

            $(document).on('click', '#btnLoadScenario', function () {
                $('#result').html("loading... (session=" + $('#sessionName').val() + ")");
                $.ajax({
                    url: '/load_scenario',
                    method: 'Get',
                    dataType: 'json',
                    data: { scenarioId: $('#scenarioId').val(), sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#btnCheck', function () {
                console.debug("check");
                $('#result').html("checking...");
                $.ajax({
                    url: '/check',
                    method: 'Get',
                    dataType: 'json',
                    data: { file: $('#jsonName').val(), sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });
            $(document).on('click', '#btnCheckCrew', function () {
                console.debug("check crew");
                $('#result').html("checking...");
                $.ajax({
                    url: '/check_crew',
                    method: 'Get',
                    dataType: 'json',
                    data: { idcrew: $("#idcrew").val(), file: $("#jsonNameRoster").val(), sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#addRoster', function () {
                console.debug("addRoster");
                $('#result').html("checking...");
                $.ajax({
                    url: '/add_roster',
                    method: 'Get',
                    dataType: 'json',
                    data: { idcrew: $('#idcrew').val(), pair_id: $('#pair_id').val(), rank: $('#rank').val(), sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#delRoster', function () {
                console.debug("delRoster");
                $('#result').html("checking...");
                $.ajax({
                    url: '/del_roster',
                    method: 'Get',
                    dataType: 'json',
                    data: { idcrew: $('#idcrew').val(), pair_id: $('#pair_id').val(), rank: $('#rank').val(), sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#btnTest', function () {
                console.debug("test");
                $('#result').html("testing...");
                $.ajax({
                    url: '/test',
                    method: 'Get',
                    dataType: 'json',
                    data: {},
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#destorySession', function () {
                console.debug("test");
                $('#result').html("destorySession...");
                $.ajax({
                    url: '/end_session',
                    method: 'Get',
                    dataType: 'json',
                    data: { sessionName: $('#sessionName').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            $(document).on('click', '#btnUpdateList', function () {
                console.debug("updateList");
                $('#result').html("update list...");
                $.ajax({
                    url: '/update_list',
                    method: 'Get',
                    dataType: 'json',
                    data: { sessionName: $('#sessionName').val(), "file": $('#jsonUpdateList').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

            //try pairing
            $(document).on('click', '#btnTryPairing', function () {
                console.debug("try pairing");
                $('#result').html("try pairing...");
                $.ajax({
                    url: '/try_pairing_on_crew',
                    method: 'Get',
                    dataType: 'json',
                    data: { sessionName: $('#sessionName').val(), "file": $('#tryPairing').val() },
                    success: function (json) {
                        if (json.result == "success") {
                            $('#result').html(json.result);
                        }
                        else {
                            $('#result').html(json.result + " code=" + json.errorCode + "  msg=" + json.errorMsg);
                        }
                    }
                });
            });

        });
    </script>
</head>
<body>
    <div class="content">
        <h1>RESTful API demo.</h1>

        <p>
            This page demonstrates how to invoke RuleEngine web
            service <tt>/load_scenario</tt>, <tt>/check</tt> URI.
            Web server calclulates the sum and returns the result.
        </p>
        <div>
            <label>SessionName:</label> <input type="text" id="sessionName" value="session_A" />
        </div>
        <div>
            <label>ScenarioId:</label> <input type="text" id="scenarioId" value="3242" />
            <input type="button" value="load scenario" id="btnLoadScenario" />
        </div>
        <hr />
        <div>
            <label>JsonFile  :</label> <input type="text" id="jsonName" value="example.json" />
            <input type="button" value="check pairing" id="btnCheck" />
        </div>
        <hr />
        <div>
            <label>rank    :</label> <input type="text" id="rank" value="CA" /><br />
            <label>PairId  :</label> <input type="text" id="pair_id" value="14024404" /><br />

            <label>crewId  :</label> <input type="text" id="idcrew" value="BR205977" />
            <input type="button" value="addRoster" id="addRoster" />
            <input type="button" value="delRoster" id="delRoster" />
        </div>
        <hr />
        <div>
            <label>JsonFile  :</label> <input type="text" id="jsonNameRoster" value="20160823_175935_checkCrew.txt" />
            <input type="button" value="check crew" id="btnCheckCrew" /><br />
        </div>
        <hr />
        <div>
            <label>JsonFile  :</label> <input type="text" id="jsonUpdateList" value="test_update_list.txt" />
            <input type="button" value="Update List" id="btnUpdateList" /><br />
        </div>
        <hr />
        <div>
            <label>JsonFile  :</label> <input type="text" id="tryPairing" value="test_try_pairing.txt" />
            <input type="button" value="Try Pairing" id="btnTryPairing" /><br />
        </div>
        <hr />
        <div>
            <label>DestroySession :        <input type="button" value="destorySession" id="destorySession" /><br />
        </div>
        <hr />
        <div>
            <label>Test :        <input type="button" value="test" id="btnTest" /><br />
        </div>
        <hr />
        <div>
            <label>Result:</label> <span id="result">&nbsp;</span>
        </div>
    </div>
</body>
</html>
